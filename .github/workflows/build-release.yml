name: Build and Release OpenWrt Manager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # Required to create releases and upload assets
  actions: read    # Required for SignPath to access GitHub artifacts

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'open-wrt-manager-ui (2)/package-lock.json'

      - name: Install dependencies
        run: npm install
        working-directory: "open-wrt-manager-ui (2)"

      - name: Build backend
        run: npm run build:backend
        working-directory: "open-wrt-manager-ui (2)"

      - name: Build Next.js frontend
        run: npm run build:ui
        working-directory: "open-wrt-manager-ui (2)"

      - name: Copy icon files
        run: Copy-Item "../build/icon.ico" "public/icon.ico" -Force
        working-directory: "open-wrt-manager-ui (2)"

      - name: Package Electron application
        if: ${{ !endsWith(github.ref, '-extension') }}
        run: npx electron-builder --win
        working-directory: "open-wrt-manager-ui (2)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SignPath Code Signing (REST API - Free Version)
      - name: Sign with SignPath
        if: startsWith(github.ref, 'refs/tags/') && !endsWith(github.ref, '-extension')
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          
          if (!$installer) {
            Write-Error "No installer found"
            exit 1
          }
          
          Write-Host "📝 Submitting to SignPath: $($installer.Name)"
          Write-Host "📦 File size: $([math]::Round($installer.Length/1MB, 2)) MB"
          
          # 1. Submit signing request via REST API
          try {
            $response = Invoke-RestMethod -Method Post `
              -Uri "https://app.signpath.io/API/v1/2f96238a-f144-41e0-bf3a-5010c66ebf97/SigningRequests/SubmitWithArtifact" `
              -Headers @{"Authorization" = "Bearer ${{ secrets.SIGNPATH_API_TOKEN }}"} `
              -Form @{
                "projectSlug" = "OpenWrt_Manager"
                "signingPolicySlug" = "release-builds"
                "artifactConfigurationSlug" = "release-installer"
                "artifact" = Get-Item $installer.FullName
              }
            
            $requestId = $response.SigningRequestId
            Write-Host "✅ Request submitted: $requestId"
            Write-Host "🔗 View request: https://app.signpath.io/Web/2f96238a-f144-41e0-bf3a-5010c66ebf97/SigningRequests/$requestId"
          }
          catch {
            Write-Error "Failed to submit signing request: $_"
            Write-Error $_.Exception.Response
            exit 1
          }
          
          # 2. Wait for signing to complete
          $timeout = 600
          $elapsed = 0
          $interval = 10
          
          while ($elapsed -lt $timeout) {
            Start-Sleep -Seconds $interval
            $elapsed += $interval
            
            try {
              $status = Invoke-RestMethod `
                -Uri "https://app.signpath.io/API/v1/2f96238a-f144-41e0-bf3a-5010c66ebf97/SigningRequests/$requestId" `
                -Headers @{"Authorization" = "Bearer ${{ secrets.SIGNPATH_API_TOKEN }}"}
              
              Write-Host "⏳ Status: $($status.Status) (elapsed: $elapsed s)"
              
              if ($status.Status -eq "Completed") {
                Write-Host "🎉 Signing completed!"
                
                # 3. Download signed artifact
                New-Item -ItemType Directory -Force -Path "dist-signed" | Out-Null
                Invoke-WebRequest `
                  -Uri "https://app.signpath.io/API/v1/2f96238a-f144-41e0-bf3a-5010c66ebf97/SigningRequests/$requestId/SignedArtifact" `
                  -Headers @{"Authorization" = "Bearer ${{ secrets.SIGNPATH_API_TOKEN }}"} `
                  -OutFile "dist-signed/$($installer.Name)"
                
                Write-Host "✅ Signed file saved to dist-signed/$($installer.Name)"
                exit 0
              }
              
              if ($status.Status -eq "Failed" -or $status.Status -eq "Denied") {
                Write-Error "❌ Signing failed: $($status.Status)"
                exit 1
              }
            }
            catch {
              Write-Warning "Error checking status: $_"
            }
          }
          
          Write-Error "⏱️ Timeout waiting for signing completion"
          exit 1
        working-directory: 'open-wrt-manager-ui (2)'
          
      - name: Build and Package Extension
        run: |
          cd browser-extension
          npm ci
          npx wxt build
          cd ..
          Compress-Archive -Path "browser-extension/.output/chrome-mv3/*" -DestinationPath "openwrt-manager-extension-${{ github.ref_name }}.zip" -Force
        working-directory: "."

      - name: Upload portable version
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') && !endsWith(github.ref, '-extension')
        with:
          files: |
            open-wrt-manager-ui (2)/dist-signed/*.exe
            openwrt-manager-extension-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Extension Only
        uses: softprops/action-gh-release@v1
        if: endsWith(github.ref, '-extension')
        with:
          files: openwrt-manager-extension-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
