name: Build and Release OpenWrt Manager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'open-wrt-manager-ui (2)/package-lock.json'
          
      - name: Install dependencies
        run: npm install
        working-directory: "open-wrt-manager-ui (2)"




      - name: Build backend
        run: npm run build:backend
        working-directory: "open-wrt-manager-ui (2)"
        
      - name: Build Next.js frontend
        run: npm run build:ui
        working-directory: 'open-wrt-manager-ui (2)'




      - name: Copy icon files
        run: Copy-Item "../build/icon.ico" "public/icon.ico" -Force
        working-directory: 'open-wrt-manager-ui (2)'
        
      - name: Package Electron application
        run: npx electron-builder --win
        working-directory: 'open-wrt-manager-ui (2)'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Sign with SignPath
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # Find the installer EXE
          $installer = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          
          if ($installer) {
            Write-Host "📝 Found installer: $($installer.FullName)"
            Write-Host "📦 File size: $([math]::Round($installer.Length/1MB, 2)) MB"
            
            # Submit to SignPath for signing
            Write-Host "🚀 Submitting to SignPath for code signing..."
            
            $response = Invoke-RestMethod -Method Post -Uri "https://app.signpath.io/API/v1/2f96238a-f144-41e0-bf3a-5010c66ebf97/SigningRequests" `
              -Headers @{
                "Authorization" = "Bearer ${{ secrets.SIGNPATH_API_TOKEN }}"
              } `
              -Form @{
                "ProjectSlug" = "OpenWrt_Manager"
                "SigningPolicySlug" = "release-builds"
                "ArtifactConfigurationSlug" = "release-installer"
                "Artifact" = Get-Item $installer.FullName
              }
            
            Write-Host "✅ SignPath signing request submitted successfully!"
            Write-Host "Request ID: $($response.SigningRequestId)"
            
            # Wait for signing to complete (with timeout)
            $timeout = 300  # 5 minutes
            $elapsed = 0
            $interval = 10  # Check every 10 seconds
            
            while ($elapsed -lt $timeout) {
              Start-Sleep -Seconds $interval
              $elapsed += $interval
              
              $status = Invoke-RestMethod -Method Get -Uri "https://app.signpath.io/API/v1/2f96238a-f144-41e0-bf3a-5010c66ebf97/SigningRequests/$($response.SigningRequestId)" `
                -Headers @{
                  "Authorization" = "Bearer ${{ secrets.SIGNPATH_API_TOKEN }}"
                }
              
              Write-Host "⏳ Signing status: $($status.Status) (elapsed: $elapsed s)"
              
              if ($status.Status -eq "Completed") {
                Write-Host "🎉 Code signing completed!"
                
                # Download signed artifact
                Invoke-WebRequest -Uri "https://app.signpath.io/API/v1/2f96238a-f144-41e0-bf3a-5010c66ebf97/SigningRequests/$($response.SigningRequestId)/SignedArtifact" `
                  -Headers @{
                    "Authorization" = "Bearer ${{ secrets.SIGNPATH_API_TOKEN }}"
                  } `
                  -OutFile $installer.FullName
