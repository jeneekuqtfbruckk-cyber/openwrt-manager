name: Build and Release OpenWrt Manager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # Required to create releases and upload assets
  actions: read    # Required for SignPath to access GitHub artifacts

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'open-wrt-manager-ui (2)/package-lock.json'
          
      - name: Install dependencies
        run: npm install
        working-directory: "open-wrt-manager-ui (2)"

      - name: Build backend
        run: npm run build:backend
        working-directory: "open-wrt-manager-ui (2)"
        
      - name: Build Next.js frontend
        run: npm run build:ui
        working-directory: 'open-wrt-manager-ui (2)'

      - name: Copy icon files
        run: Copy-Item "../build/icon.ico" "public/icon.ico" -Force
        working-directory: 'open-wrt-manager-ui (2)'
        
      - name: Package Electron application
        run: npx electron-builder --win
        working-directory: 'open-wrt-manager-ui (2)'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SignPath Code Signing (Official Method)
      # Upload unsigned artifact for SignPath
      - name: Upload unsigned artifact
        id: upload-unsigned
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: "open-wrt-manager-ui (2)/dist/*.exe"
          retention-days: 1

      # Submit to SignPath using official action
      - name: Submit to SignPath for code signing
        id: signpath
        if: startsWith(github.ref, 'refs/tags/')
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '2f96238a-f144-41e0-bf3a-5010c66ebf97'
          project-slug: 'OpenWrt_Manager'
          signing-policy-slug: 'release-builds'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'open-wrt-manager-ui (2)/dist-signed'
          wait-for-completion-timeout-in-seconds: 600

      # Display signing results
      - name: Display signing results
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Write-Host "✅ Code signing completed!"
          Write-Host "Signing Request ID: ${{ steps.signpath.outputs.signing-request-id }}"
          Write-Host "Signing Request URL: ${{ steps.signpath.outputs.signing-request-web-url }}"
          
      - name: Upload portable version
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrtManager-Portable
          path: "open-wrt-manager-ui (2)/dist/win-unpacked/**"
          
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrtManager-Setup
          path: "open-wrt-manager-ui (2)/dist/*.exe"
          
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            open-wrt-manager-ui (2)/dist-signed/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
